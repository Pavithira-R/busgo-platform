# Local development database. Same major version as the AWS RDS instance (16).
services:
  db:
    image: postgres:16-alpine
    container_name: busgo-db
    environment:
      POSTGRES_USER: busgo
      POSTGRES_PASSWORD: busgo
      POSTGRES_DB: busgo
    ports:
      - '5432:5432'
    volumes:
      - busgo-pgdata:/var/lib/postgresql/data

volumes:
  busgo-pgdata:
